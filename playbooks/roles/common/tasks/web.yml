---
- name: Update apt cache
  apt:
    update_cache: yes

- name: Install NGINX
  apt:
    name: nginx
    state: present

- name: Ensure /opt/static-sites exists
  file:
    path: /opt/static-sites
    state: directory
    owner: webapp
    group: webapp
    mode: '0755'

- name: Deploy index.html
  copy:
    content: "<h1>Welcome to NGINX!</h1>"
    dest: /opt/static-sites/index.html
    owner: webapp
    group: webapp
    mode: '0644'

- name: Start and enable NGINX
  service:
    name: nginx
    state: started
    enabled: yes

