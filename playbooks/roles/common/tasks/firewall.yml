---
- name: Install UFW
  apt:
    name: ufw
    state: present

- name: Allow SSH
  ufw:
    rule: allow
    port: 22

- name: Allow HTTP
  ufw:
    rule: allow
    port: 80

- name: Deny all other incoming
  ufw:
    default: deny
    direction: incoming

- name: Enable UFW
  ufw:
    state: enabled

